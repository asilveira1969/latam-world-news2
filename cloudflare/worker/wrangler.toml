name = "latam-world-news-d1-staging"
main = "src/index.ts"
compatibility_date = "2026-08-28"

[vars]
INFOBAE_MANUAL_ENABLED = "false"
INFOBAE_SCHEDULED_ENABLED = "false"

# RSS runs every four hours. The daily trigger is 00:00 America/Montevideo
# (03:00 UTC) and removes expired pending editorial inbox items only.
[triggers]
crons = ["0 */4 * * *", "0 3 * * *"]

# Revalidated production binding, 2026-10-11. Despite its staging name,
# this Worker/database serves the public site and was deployed with this config.
[[d1_databases]]
binding = "DB"
database_name = "latam-world-news-staging"
database_id = "5f0f9b93-a6d2-470b-b719-2bb066cda8da"
migrations_dir = "../migrations"
